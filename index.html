<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI内容管理后台 - Demo</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        var __v = new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 14);
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0d1f4a 0%, #165dff 55%, #4080ff 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        h1 { font-size: 36px; margin-bottom: 8px; }
        .subtitle { opacity: 0.88; margin-bottom: 8px; font-size: 15px; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            font-size: 12px;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            padding: 14px 24px;
            margin: 10px 0;
            background: white;
            color: #165dff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .hint {
            margin-top: 24px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.12);
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.7;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI内容管理后台</h1>
        <div class="subtitle">2026 · AI 能力全面升级</div>
        <div class="badge">GitHub Pages 在线 Demo</div>

        <a id="enterBtn" class="btn" href="creative-tools-prototype.html">进入平台</a>

        <div class="hint">
            <strong>包含模块</strong><br>
            首页宣传 · 万能指令 · 爆款创意通晒 · 素材洞察 · 视频编辑 · 原料库 · 视频创作<br><br>
            <strong>说明</strong><br>
            纯静态原型，AI 生图/视频生产/数据查询等为前端 Mock，无需本地后端即可体验交互。
        </div>
        <p style="margin-top: 20px; font-size: 12px; opacity: 0.7;">部署时间: <span id="deployTime"></span></p>
    </div>
    <script>
        document.getElementById('deployTime').textContent = new Date().toLocaleString('zh-CN');
        var url = 'creative-tools-prototype.html?module=home&v=' + __v;
        document.getElementById('enterBtn').href = url;
        setTimeout(function() { location.href = url; }, 4000);
    </script>
</body>
</html>
