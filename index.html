<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI创意工具 - 最新版本</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        // 自动版本号防缓存
        var __v = new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 14);
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .version {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin: 10px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .features {
            margin-top: 40px;
            text-align: left;
            font-size: 14px;
            line-height: 2;
        }
        .feature-item {
            margin: 10px 0;
        }
        .new-badge {
            background: #ff4d4f;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI创意工具</h1>
        <div class="version">在线预览 Demo（GitHub Pages）</div>
        
        <a id="enterBtn" href="creative-tools-prototype.html" class="btn">
            🚀 进入创意工具
        </a>
        
        <div class="features">
            <div class="feature-item">✅ 扩图功能 - AI智能扩图</div>
            <div class="feature-item">✅ 换背景 - 背景替换与生成</div>
            <div class="feature-item">✅ 背景裂变 - 风格相似生成</div>
            <div class="feature-item">✅ 图片创作 - 海报模板</div>
            <div class="feature-item">✨ 万能指令 - 自由AI指令 <span class="new-badge">NEW</span></div>
            <div class="feature-item">🔀 仿写裂变 - 素材仿写与风格裂变 <span class="new-badge">NEW</span></div>
            <div class="feature-item">📝 意见管理 - 反馈管理</div>
        </div>
        
        <div style="margin-top: 30px; padding: 12px 16px; background: rgba(255,255,255,0.12); border-radius: 8px; font-size: 12px; line-height: 1.7; text-align: left;">
            <strong>📌 在线 Demo 提示</strong><br>
            页面为纯静态预览，UI 与交互完整可用；图片上传 / AI 生成等需后端支持的能力<br>
            在 Demo 环境下不会真正调用接口，仅作展示用途。
        </div>

        <div style="margin-top: 24px; font-size: 12px; opacity: 0.7;">
            <p>部署时间: <span id="deployTime"></span></p>
        </div>
    </div>
    
    <script>
        document.getElementById('deployTime').textContent = new Date().toLocaleString('zh-CN');
        var url = 'creative-tools-prototype.html?v=' + __v;
        document.getElementById('enterBtn').href = url;

        setTimeout(() => {
            window.location.href = url;
        }, 3000);
    </script>
</body>
</html>
